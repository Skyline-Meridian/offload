# Shared service definitions. Use together with compose.local.yaml (development) or compose.prod.yaml (production):
#   docker compose --env-file .env.local -f compose.yaml -f compose.local.yaml up -d db
# See docs/implementation/01. general_implementation.md section 20.
name: offload

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: offload
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_REALTIME_PASSWORD: ${DB_REALTIME_PASSWORD}
      DB_RETENTION_PASSWORD: ${DB_RETENTION_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d offload']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  realtime:
    build:
      context: .
      dockerfile: docker/realtime.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
